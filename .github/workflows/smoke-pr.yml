name: Smoke (pull request)

# Runs the Playwright smoke suite against the Vercel preview deployment of the
# pull request, as a regular PR check (job name: "smoke" — can be marked a
# required status check in branch protection).
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  deployments: read

concurrency:
  group: smoke-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Test the PR's own head, not the merge ref, so the tests match the
          # commit the Vercel preview was built from.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check Supabase secrets are available
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY are empty. Fork and Dependabot PRs get no repo Actions secrets (Dependabot has its own store); otherwise add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Wait for the Vercel preview deployment
        id: preview
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for i in $(seq 1 60); do
            dep=$(gh api "repos/$REPO/deployments?sha=$SHA&per_page=10" \
              --jq '[.[] | select(.environment | test("Preview"; "i"))][0].id // empty')
            if [ -n "$dep" ]; then
              read -r state url < <(gh api "repos/$REPO/deployments/$dep/statuses?per_page=1" \
                --jq '.[0] | "\(.state) \(.environment_url // "")"')
              echo "attempt $i: deployment $dep state=${state:-none}"
              if [ "$state" = "success" ] && [ -n "$url" ]; then
                echo "url=$url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                echo "::error::Vercel preview deployment failed"
                exit 1
              fi
            else
              echo "attempt $i: no preview deployment yet"
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for the Vercel preview deployment"
          exit 1

      - name: Warm up the preview and check its health
        env:
          URL: ${{ steps.preview.outputs.url }}
        run: |
          URL="${URL%/}"
          for p in /book /services /api/health; do
            curl -s -o /dev/null --retry 5 --retry-delay 5 --retry-all-errors --max-time 60 "$URL$p" || true
          done
          code=$(curl -s -o health.json -w '%{http_code}' --retry 3 --retry-delay 5 --retry-all-errors --max-time 60 "$URL/api/health" || echo 000)
          echo "health: HTTP $code"
          cat health.json 2>/dev/null || true
          echo
          if [ "$code" = "404" ] || [ "$code" = "000" ]; then
            echo "::warning::/api/health not reachable (HTTP $code); continuing"
            exit 0
          fi
          if ! grep -q '"database":"ok"' health.json; then
            echo "::error::Preview /api/health reports the database is not ok. Check Vercel Preview env vars (NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY, NEXT_PUBLIC_SITE_URL)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.url }}
          # TODO: set REQUIRE_MIGRATION_0007: "1" here once migrations 0007 and
          # 0009 are applied to the live DB (enforces the anon-privilege tests
          # in tests/smoke/rpcs.spec.ts).
        run: npx playwright test tests/smoke

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-pr-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
