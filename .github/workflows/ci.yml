name: CI

# Static gate for every pull request: lint, typecheck and a production build.
# It needs no secrets — the build only inlines public env, and the catalog
# pages fall back gracefully when Supabase is not configured.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Dependency audit (high+, advisory)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run db:setup:check
      - run: npm run test:db
      - run: npm run test:unit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
