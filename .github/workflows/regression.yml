name: Regression tests

# Pull requests get lint/typecheck/build from ci.yml and the smoke suite via
# smoke-pr.yml (against the Vercel preview); this workflow covers production
# deploys.
#
# Fires from Vercel's GitHub integration posting a deployment status — not on
# push — so this always tests the URL that actually finished deploying,
# whether that's a PR preview or production, instead of guessing how long a
# build takes.
on:
  deployment_status:

jobs:
  smoke:
    # PR previews are covered by smoke-pr.yml as a real PR check.
    if: |
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.target_url }}
      # Only needed if the production deployment URL is behind Vercel Authentication.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          # test the commit that was actually deployed
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # TODO: once migrations 0007 and 0009 are applied to the live DB, add
      # REQUIRE_MIGRATION_0007: "1" to this step's env so the anon-privilege
      # assertions in tests/smoke/rpcs.spec.ts are enforced.
      - run: npx playwright test tests/smoke
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

  e2e:
    # The expensive suite (creates + pays for a real test appointment) only
    # runs for an actual production deploy, not every PR preview.
    if: |
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Stripe sends the browser back to NEXT_PUBLIC_SITE_URL, not to the
      # per-deployment URL. The HttpOnly hold-token cookie is origin-bound, so
      # the test must book on that same canonical origin or the confirmation
      # page 404s. Override with the NEXT_PUBLIC_SITE_URL repo variable.
      PLAYWRIGHT_BASE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://justhairs.vercel.app' }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Require the service-role key
        # Without it the tests' cleanup can't delete the appointments they
        # create, so they'd leak rows into the live DB and collide on retry.
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY repo secret is not set; e2e needs it to clean up its appointments."
            exit 1
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
