<!--
  justhairs — email one-time-password template.

  Paste this into Supabase → Authentication → Email Templates for BOTH:
    • "Magic Link"      (sent to returning users on sign-in)
    • "Confirm signup"  (sent the first time an email signs in)

  Supabase substitutes {{ .Token }} with the 6-digit code.
-->
<table
  role="presentation"
  width="100%"
  cellpadding="0"
  cellspacing="0"
  style="background:#f2f2f5;padding:32px 0;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif"
>
  <tr>
    <td align="center">
      <table
        role="presentation"
        width="420"
        cellpadding="0"
        cellspacing="0"
        style="background:#ffffff;border-radius:16px;padding:32px;max-width:420px"
      >
        <tr>
          <td style="font-size:15px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#6440fe">
            justhairs
          </td>
        </tr>
        <tr>
          <td style="padding-top:20px;font-size:20px;font-weight:700;color:#1c1c28">
            Your sign-in code
          </td>
        </tr>
        <tr>
          <td style="padding-top:8px;font-size:14px;color:#8f90a6">
            Enter this code in the app to finish signing in. It expires in
            60&nbsp;minutes.
          </td>
        </tr>
        <tr>
          <td style="padding-top:24px">
            <div
              style="background:#f2eeff;border-radius:12px;padding:18px;text-align:center;font-size:32px;font-weight:700;letter-spacing:10px;color:#3f13fe"
            >
              {{ .Token }}
            </div>
          </td>
        </tr>
        <tr>
          <td style="padding-top:24px;font-size:12px;color:#8f90a6;line-height:1.5">
            If you didn&rsquo;t request this, you can ignore this email — no
            account changes are made without the code.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
